# PostgreSQL 16 pentru dezvoltare si teste: `docker compose up -d`.
# La prima pornire se creeaza baza de dezvoltare (POSTGRES_DB) si baza de test
# (docker/postgres-init/). Valorile vin din .env, cu aceleasi valori implicite
# pe care le scrie `npm run setup`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-campus_sports_booking}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - date-postgres:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER"']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  date-postgres:
